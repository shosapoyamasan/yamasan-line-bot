name: Keep Alive and Daily Prompts

on:
  schedule:
    - cron: '0 * * * *'
    - cron: '30 23 * * *'
    - cron: '0 8 * * *'

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Wake up server
        run: curl -s --max-time 60 https://yamasan-line-bot.onrender.com/webhook || true

      - name: Morning prompt 8:30 JST
        if: github.event.schedule == '30 23 * * *'
        run: curl -s --max-time 60 https://yamasan-line-bot.onrender.com/ask || true

      - name: Evening prompt 17:00 JST
        if: github.event.schedule == '0 8 * * *'
        run: curl -s --max-time 60 https://yamasan-line-bot.onrender.com/ask || true
